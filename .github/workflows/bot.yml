name: Jumia Order Monitor
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: jumia-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    if: vars.JUMIA_SERVER_ACTIVE != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          JUMIA_CLIENT_ID: ${{ secrets.JUMIA_CLIENT_ID }}
          JUMIA_REFRESH_TOKEN: ${{ secrets.JUMIA_REFRESH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHOP_NAME: ${{ vars.SHOP_NAME || secrets.SHOP_NAME }}
          JUMIA_LOOKBACK_DAYS: '14'
        run: python bot.py
      - name: Save notification IDs (also after a partially completed monitor run)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notified_orders.json
          if ! git diff --cached --quiet; then
            git commit -m "Track notified Jumia order IDs [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
