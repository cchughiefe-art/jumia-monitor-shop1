name: Discover Stations
on: workflow_dispatch # This lets you trigger it manually from the Actions tab

jobs:
  run-discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run discovery script
        run: python discovery.py
        env:
          JUMIA_CLIENT_ID: ${{ secrets.JUMIA_CLIENT_ID }}
          JUMIA_REFRESH_TOKEN: ${{ secrets.JUMIA_REFRESH_TOKEN }}
          
